name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup NuGet
        uses: nuget/setup-nuget@v2

      - name: Restore
        run: nuget restore src/FlipIt.sln

      - name: Build (Release, x86)
        run: msbuild src/FlipIt/FlipIt.csproj /p:Configuration=Release /p:Platform=x86 /p:RestorePackages=false

      - name: Package
        shell: pwsh
        run: |
          $out = "src/FlipIt/bin/Release"
          # 仅打包运行所需文件（exe / scr / config / pdb 可选）
          $files = @(
            "$out/FlipIt.exe",
            "$out/FlipIt.exe.config",
            "$out/FlipIt.scr",
            "$out/桌面时钟.exe",
            "$out/桌面时钟.exe.config"
          )
          Compress-Archive -Path $files -DestinationPath FlipIt.zip -Force

      - name: Release
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          name: FlipIt ${{ github.ref_name }}
          files: FlipIt.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
